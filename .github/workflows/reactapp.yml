name: React Docker CI/CD with Trivy

on:
  push:
    branches:
      - joneretziger-hub-patch-1

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Local Repository
        run: |
          cd /home/jone/Downloads/Docker/react-app
          git fetch origin
          git checkout joneretziger-hub-patch-1
          git pull origin joneretziger-hub-patch-1

      - name: Build Docker Image
        run: |
          cd /home/jone/Downloads/Docker/react-app
          docker build -t react-app:latest .

      - name: Scan Docker Image Using Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            react-app:latest

      - name: Stop Existing Container
        run: |
          docker stop react-container || true

      - name: Remove Existing Container
        run: |
          docker rm react-container || true

      - name: Run Docker Container
        run: |
          docker run -d \
            --name react-container \
            -p 2000:80 \
            react-app:latest
